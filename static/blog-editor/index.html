<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="/robot-icon.png">
<title>写博客 · Ma Kai</title>
<link rel="stylesheet" href="./milkdown/editor.css?v=31c216a76c"><link rel="stylesheet" href="./style.css?v=071eb45720">
<script type="module" src="./app.js?v=4761ce84d3"></script>
</head>
<body>
<header class="header">
  <div class="header-start"><button id="toggle-articles" type="button" aria-expanded="false" aria-controls="article-sidebar">文章</button><a class="brand" href="/">Ma Kai <span>/ Blog</span></a></div>
  <div class="header-end"><span id="draft-status" role="status">本地草稿</span><a id="view" hidden target="_blank" rel="noopener">查看文章</a><button id="toggle-settings" type="button" aria-expanded="false" aria-controls="settings-panel">发布设置</button><button id="publish" class="primary" type="button">发布文章</button></div>
</header>
<div class="layout">
  <aside id="article-sidebar" class="sidebar" hidden>
    <div class="sidebar-heading"><strong>文章</strong><button id="close-articles" type="button" aria-label="关闭文章列表">关闭</button></div>
    <button id="new" class="primary" type="button">＋ 新建文章</button>
    <h2>本地草稿</h2><p id="draft-empty" class="muted">还没有草稿</p><div id="drafts"></div>
    <div class="list-heading"><h2>网站文章</h2><button id="refresh" type="button">刷新</button></div><p id="list-status" role="status" class="muted">正在加载文章…</p><div id="posts"></div>
    <nav><a href="/post/">查看博客</a><a href="/">返回主页</a></nav>
  </aside>
  <main>
    <h1 id="editor-heading" class="sr-only">写一篇新文章</h1>
    <p id="status" role="status" aria-live="polite">正在准备编辑器…</p><a id="deployment" hidden target="_blank" rel="noopener">查看发布进度</a>
    <form id="editor" autocomplete="off">
      <section id="settings-panel" class="settings-panel" hidden aria-label="发布设置">
        <div class="sidebar-heading"><strong>发布设置</strong><button id="close-settings" type="button">关闭</button></div>
        <label for="slug">文章地址 <span>发布后固定</span></label><input id="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required><small id="url-hint"></small>
        <label for="date">发布日期</label><input id="date" type="date" required>
        <label for="summary">摘要 <span>可选</span></label><textarea id="summary" rows="3" placeholder="用一两句话介绍文章"></textarea>
        <label for="tags">标签 <span>以逗号分隔</span></label><input id="tags" placeholder="机器人, 研究笔记">
        <div class="settings-account"><button id="connect" type="button">连接 GitHub</button><p class="muted">令牌只用于本次会话，草稿保存在此浏览器。</p></div>
        <div class="backup-actions"><button id="export" type="button">导出草稿</button><button id="import" type="button">导入草稿</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
      </section>
      <label for="title" class="sr-only">文章标题</label><input id="title" placeholder="无标题" maxlength="200" required>
      <div class="writing-header"><span class="writing-hint">选中文字排版 · 输入 / 插入内容</span><div class="tabs" role="group" aria-label="正文视图"><button id="image" type="button">图片</button><button id="source-tab" type="button" aria-pressed="false">Markdown</button><button id="write-tab" type="button" aria-pressed="true">编写</button><button id="preview-tab" type="button" aria-pressed="false">预览</button></div></div>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden multiple>
      <div id="writing"><div id="milkdown"></div><label for="body" class="sr-only">Markdown 正文</label><textarea id="body" rows="24" hidden placeholder="使用 Markdown 编写正文…"></textarea></div>
      <article id="preview" class="prose" hidden aria-label="文章预览"></article>
    </form>
  </main>
</div>
  <dialog id="auth"><form method="dialog"><h2>连接 GitHub</h2><p>连接后可将文章发布到 <strong>Berumotto-mk.github.io</strong>。只需为该仓库授予 <strong>Contents 读写</strong>权限。</p><p>令牌仅保存在当前页面内存中，刷新或关闭页面后需要重新连接。</p><a href="https://github.com/settings/personal-access-tokens/new?name=Blog%20Editor&amp;target_name=Berumotto-mk&amp;expires_in=30&amp;contents=write" target="_blank" rel="noopener">创建 GitHub 细粒度访问令牌</a><label for="token">GitHub 访问令牌</label><input id="token" type="password" autocomplete="off" spellcheck="false"><p id="auth-error" role="alert"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="authorize" type="button" class="primary">连接</button></div></form></dialog>
  <dialog id="publish-dialog"><form method="dialog"><h2>发布这篇文章？</h2><p id="publish-details"></p><p>发布后所有访客都可以阅读。网站会自动构建，通常需要约一分钟。</p><div class="dialog-actions"><button value="cancel">继续编写</button><button value="publish" class="primary">确认发布</button></div></form></dialog>

</body>
</html>
